name: Feedback
description: Something to change after using the app
labels: [feedback]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened or what would you like?
      placeholder: On the results screen Maya couldn't find the review button…
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options: [Child test, Results and rankings, Parent dashboard, Question approval, Accounts and groups, Other]
  - type: dropdown
    id: priority
    attributes:
      label: Priority
      options: [P1 - blocks use, P2 - annoying, P3 - nice to have]
  - type: input
    id: device
    attributes:
      label: Device
      placeholder: iPhone 13 / Mac Chrome
